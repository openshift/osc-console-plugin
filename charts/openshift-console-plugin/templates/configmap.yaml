apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
data:
  {{- $tls := include "openshift-console-plugin.nginxTLS" . | fromJson }}
  nginx.conf: |
    # TLS profile source: {{ $tls.source }}
    error_log /dev/stdout info;
    events {}
    http {
      access_log         /dev/stdout;
      include            /etc/nginx/mime.types;
      default_type       application/octet-stream;
      keepalive_timeout  65;
      server {
        listen              {{ .Values.plugin.port }} ssl;
        listen              [::]:{{ .Values.plugin.port }} ssl;
        {{- if .Values.plugin.nginx.http2 }}
        http2               on;
        {{- end }}
        ssl_certificate     /var/cert/tls.crt;
        ssl_certificate_key /var/cert/tls.key;
        {{- if $tls.protocols }}
        ssl_protocols       {{ $tls.protocols }};
        {{- end }}
        {{- if $tls.ciphers }}
        ssl_ciphers         {{ $tls.ciphers }};
        {{- end }}
        {{- if $tls.ciphersuites }}
        ssl_conf_command    Ciphersuites {{ $tls.ciphersuites }};
        {{- end }}
        ssl_prefer_server_ciphers {{ .Values.plugin.nginx.ssl_prefer_server_ciphers }};
        {{- if $tls.groups }}
        ssl_ecdh_curve      {{ $tls.groups }};
        {{- end }}
        server_tokens       off;
        root                /usr/share/nginx/html;
      }
    }
